schedule:
  # 抓取与处理间隔（小时）
  fetch_interval_hours: 2
  # 「昨天」日报的定稿时间 HH:MM（默认昨天已不再变化，出的是定稿）
  daily_report_time: "早上八点"
  # 清理时间 HH:MM
  cleanup_time: "03:00"

storage:
  retention_days: 30
  db_path: data/smtm.db
  # 去重时比对的历史标题条数
  dedup_recent_window: 500

web:
  host: 0.0.0.0
  port: 8000

llm:
  timeout_seconds: 60
  max_retries: 2
  temperature: 0.3

ai:
  # 每个调度周期最多处理多少篇 pending（每篇要花 2~3 次 LLM 调用）
  batch_size: 60
  # 每处理多少篇提交一次，防止长任务中途失败回滚全部进度
  batch_checkpoint_every: 10

fetcher:
  timeout_seconds: 15
  max_retries: 2
  user_agent: "ShowMeTheMoney/0.1 (+https://github.com/zackzou/show-me-the-money)"
  # 只收最近 N 天发布的文章：挡掉「一次返回整个历史」的归档型 feed
  max_age_days: 14
  # 单个信源单次最多入库条数（成本闸门）
  max_items_per_source: 60
  # 正文短于该长度视为「只有标题」直接丢弃，0 = 不限制
  min_content_chars: 0
