# 提示词模板。占位符：{research_topic} {title} {content} {summary}

summary_prompt: |
  你是一名行业情报分析师。请用中文为以下文章生成摘要。
  要求：
  1. 100 字以内。
  2. 答案先行，先给结论再补充信息。
  3. 不编造事实，不添加原文没有的内容。
  4. 若与调研方向相关，请突出相关部分。
  5. 只输出纯文本：不要使用 Markdown 标记（不要 **、##、- 等），不要加标题。
  调研方向：{research_topic}
  文章标题：{title}
  文章正文：{content}

# 速览 / AI 导读：让读者在页面里就能读完这条 news，不用跳去原站。
# 写法上刻意模仿新闻导语——时间 + 主体 + 动作 + 关键数字。
digest_prompt: |
  请为这篇 news 写一段导语，让读者不点开原文也能明白它在讲什么。
  要求：
  1. 2~3 句，120 字以内。
  2. 按「时间 + 谁 + 做了什么 + 关键数字」的顺序叙述。
  3. 只用原文提供的信息，缺哪部分就省略，绝不编造。
  4. 说清它为什么值得关心，与调研方向的关系。
  5. **输出两行**：第一行中文导语，第二行同一段话的英文版，以 "EN: " 开头。
     为什么一定要两行：英文信源在「英文」模式下这一段不能显示中文 ——
     而以前英文版是拿中文摘要直接顶上去的（实测英文模式下的 AI 导读里写着
     中文），读者看到的是「英文文章配中文导读」。一次调用出两种语言，
     比事后单独再翻一次便宜得多。
  6. 只输出纯文本：不要用 Markdown 标记，不要加标题，不要分点。
  文章标题：{title}
  文章摘要：{summary}
  文章正文：{content}

# 推荐理由：回答「读者为什么要点开这条」，用于列表页卡片底部。
reason_prompt: |
  用中文写一句话，说明读者为什么值得关心这条 news。
  要求：
  1. 一句话，50 字以内。
  2. 指出这条里最有信息量的点（具体数字、影响范围、反直觉之处），不要空泛地说「值得关注」。
  3. 只依据原文，不要编造，也不要加「本文」「该文章」这类指代。
  4. 只输出这一句话，不要解释，不要 Markdown 标记。
  调研方向：{research_topic}
  文章标题：{title}
  文章摘要：{summary}

# 分类 + 主题：一次调用同时产出两个字段，省一次往返。
# 期望输出两行：第一行分类名，第二行主题（英文逗号分隔）。
classify_prompt: |
  给下面这条内容做分类和主题标注。

  分类只能从下面这份清单里选一个（不要自造）：
  「{categories}」

  主题：给出 1~3 个能概括这条内容的主体/领域，2~10 个字，
  例如 `OpenAI`、`大模型`、`芯片算力`、`开源生态`。

  输出格式：严格两行，第一行只写分类名，第二行写主题（英文逗号分隔）。
  不要解释，不要 Markdown 标记。

  调研方向：{research_topic}
  文章标题：{title}
  文章摘要：{summary}

# 中译英：一次调用同时产出英文标题与英文速览。
# 期望输出两行：第一行英文标题，第二行英文导语。
translate_prompt: |
  把下面这条中文资讯翻译成英文。

  要求：
  1. 第一行：英文标题，沿用原文标题的说法，不要改写成营销腔。
  2. 第二行：英文导语，2~3 句，把摘要完整译过来。
  3. 专有名词（公司、产品、模型）用行业里通行的英文写法，首次出现可保留原文。
  4. 只输出英文，不要解释，不要 Markdown 标记，不要空行。

  中文标题：{title}
  中文导语：{summary}

# 英译中正文：不是逐句对译，而是**用中文重新写成一篇能读的文章**。
# 起因：早期版本要求「段落一一对应、逐句完整翻译」，产出的是机翻腔 ——
# 原文 README 里一句玩笑副标题被直译成「我得离开去看《JOJO的奇妙冒险》了」，
# 中文读者读到的不是资讯而是一份 awkward 的译文。中文不是英语的逐句投影。
translate_content_prompt: |
  下面是一段英文科技资讯。请**用中文重新写成一篇中国读者能顺畅读完的文章**，
  不是逐句对译。

  写作要求：
  1. 只输出文章正文，不要解释、不要标题、不要 Markdown 标记。
  2. **按中文习惯重写句子**：长定语从句拆开、被动语态改主动、
     代词指代补全（英文反复用 it / they，中文要写清楚「它」「这些活动」）。
     读起来要像中文媒体自己写的稿子，而不是译文。
  3. **重新组织段落**：按信息逻辑分段，一段讲一件事。
     不要照搬原文的换行位置，也不要把英文的短句列表原样变成电报体。
  4. **不漏信息，但不逐句对应**：原文每个事实、数字、条件都要在；
     但可以合并同类项、把英文的铺垫句压成一句中文。
     目标篇幅是原文的 40%~70%，压缩的是句式冗余，不是信息。
  5. **丢掉对中文读者无意义的碎片**：装饰性图片说明、图标标签、
     徽章文字（如 Agent / Python 3.9+ / Status: Experimental 这类并排小标签）、
     作者的自言自语式玩笑话、跑题的口号。这些不是资讯，删掉不影响信息完整。
     但如果那句话本身是信息（比如「实验性功能，慎用」），就正常写出来。
  6. 专有名词用通行中文译法，首次出现可括注英文原文（如「智能体（agent）」）。
     命令行、配置片段、文件路径原样保留，不要翻译。
  7. 保留全部数字、版本号、日期、引用出处。

  英文原文：
  {text}

# 英译中正文（批量）：一次调用翻多个片段，对齐 AIHOT 的 translate-body。
# 条数校验代替长度校验 —— 模型少翻/多翻一段时条数对不上，整批退回逐块兜底。
# 占位符：{count} 片段数、{segments} 编号后的片段正文。
translate_batch_prompt: |
  你是专业的科技新闻译者。下面是一篇英文资讯的 {count} 个片段，
  请把每个片段**用中文重新写成中国读者能顺畅读完的文章**，不是逐句对译。

  写作要求：
  1. 按原顺序输出**恰好 {count} 段**译文，放在 JSON 的 t 数组里：
     {{"t": ["<第1段中文>", "<第2段中文>", ...]}}。
  2. **按中文习惯重写句子**：长定语从句拆开、被动语态改主动、
     代词指代补全（英文反复用 it / they，中文要写清楚「它」「这些活动」）。
     读起来要像中文媒体自己写的稿子，而不是译文。
  3. **重新组织段落**：按信息逻辑分段，一段讲一件事；
     不要把英文的短句列表原样变成电报体。
  4. **不漏信息，但不逐句对应**：原文每个事实、数字、条件都要在；
     可以合并同类项，目标篇幅是原文的 40%~70%，压缩的是句式冗余，不是信息。
  5. **丢掉对中文读者无意义的碎片**：装饰性图片说明、图标标签、
     徽章文字、作者的自言自语式玩笑话、跑题的口号；但信息性内容要保留。
  6. 专有名词用通行中文译法，首次出现可括注英文原文。
     命令行、配置片段、文件路径、网址原样保留，不要翻译。
  7. 保留全部数字、版本号、日期、引用出处。
  8. 片段本身已是中文、或只有符号数字时，原样返回该片段。

  只输出 JSON，不要解释，不要 Markdown 代码块。t 数组必须恰好 {count} 项。

  英文片段：
  {segments}

# 英译中标题：英文信源只有英文标题，中文模式与早报都需要一个中文标题。
translate_title_zh_prompt: |
  把下面这条科技资讯的英文标题改写成一个中文标题。

  要求：
  1. 只输出中文标题本身，不要引号、不要解释、不要换行。
  2. **不要逐词硬译**。读起来要像中文科技媒体的标题，
     而不是把英文词序照搬过来（"EventMaxxer 自动申请活动，助你进入对的社交圈"
     这类堆砌名词的直译是不合格的）。
  3. 说清这条讲什么、读者能拿到什么，控制在 30 字以内。
  4. 专有名词用通行中文译法，必要时保留原文英文。

  英文标题：{title}

# 英译中速览：英文信源的 AI 导读默认也是英文的，中文模式必须有一份中文导读，
# 否则读者在「中文」模式下看到的还是整段英文。
translate_digest_zh_prompt: |
  把下面这段英文资讯导读改写成中文导语。

  要求：
  1. 只输出中文导语本身，不要标题、不要解释、不要换行、不要 Markdown 标记。
  2. **不要逐句对译**。用中文重写：拆开长定语、补全代词指代，
     读起来要像中文科技媒体自己写的导语，而不是译文。
  3. 保持原来的一到三句与信息密度，不要扩写成摘要，也不要压成标题。
  4. 专有名词（公司、产品、模型、人名）用通行中文译法，首次出现可括注原文。

  英文导读：{text}

# 同题判定：同一件事被多家源转载时，标题措辞差别很大，只能问模型。
# 判定为「同一件事」时只保留一条主条目，其余标记为重复稿。
same_story_prompt: |
  下面两条是同一天里抓到的科技资讯标题。判断它们说的是**同一件事**吗？

  只回答 yes 或 no，不要解释。

  - 同一件事的不同报道 / 不同媒体的转载 / 同一发布会的不同角度 → yes
  - 同一话题但不同的事件、同一公司的不同产品、不同的论文 → no
  - 一条是评论或解读、另一条是原始新闻，且事件完全对应 → yes

  程序用词面重合度初筛，把两条标题给你。**共同出现的词只是线索，不是证据** ——
  open / model / ai / launch 这类通用词谁都能沾上，只有靠这些词重合的一律判 no。
  要看的是：讲的是不是**同一个具体事件**（同一家公司、同一个产品、同一天发生的事）。

  标题 A：{title_a}

  标题 B：{title_b}

  共同出现的词：{shared_words}

tag_prompt: |
  请为以下文章提取 3~5 个中文关键词或标签。
  只输出标签，用英文逗号分隔，不要解释，不要使用 Markdown 标记。
  标题：{title}
  摘要：{summary}

# 相关度判断顺带给出评分，省掉一次调用。
# 期望输出：`yes 85` 或 `no 10`（分数 0~100）
relevance_prompt: |
  判断下面这条内容是否与调研方向**直接相关**，并给出相关度评分。

  规则（按顺序）：
  1. 只根据给出的标题与摘要判断，不要用常识猜测看不到的内容。
  2. 信息太少、无法判断（只有标题、摘要为空或一句没信息量的话），回答 no。
  3. 只是泛科技、财经、体育、生活、八卦，与调研方向沾边但不相关的，回答 no。
  4. 属于调研方向的立项、产品、融资、指标、事故、监管等实质进展，回答 yes。

  评分标准（0~100，只给整数）：
  - 90~100：直接命中调研方向，且有具体的产品/融资/指标/事故进展
  - 60~89：属于该方向，但只是常规动态
  - 30~59：强相关方向的外围信息
  - 0~29：不相关

  输出格式：先回答 yes 或 no，空一格再给分数，例如 `yes 85` 或 `no 5`。
  不要输出其它内容。

  调研方向：{research_topic}
  标题：{title}
  摘要：{summary}

# LLM 不可用时的降级摘要长度（正文前 N 字）
fallback_summary_chars: 200
# 降级速览长度（正文前 N 字）
fallback_digest_chars: 180
# 降级推荐理由长度（正文前 N 字）
fallback_reason_chars: 80

# 早报推送语：左上角「早报片段」浮层与手机端推送共用一段话。
# 不要截断拼凑 —— 截断的半句、电报体关键词在手机上没法读。
brief_prompt: |
  给下面这条科技资讯写一段「早报推送语」，读者在手机上扫一眼就能读完。

  要求：
  1. 一段话，一到三句，60~120 字：信息少就写短，信息多可放到 120 字，
     不要硬凑字数，也不要砍掉关键数字与时间。
  2. 先说发生了什么（谁 + 做了什么 + 关键数字/时间），再补一句为什么重要。
  3. 中文，通顺自然：不要电报体、不要关键词堆砌、不要省略主语。
  4. 只输出推送语本身，不要标题、不要解释、不要 Markdown 标记。

  文章标题：{title}
  文章导读：{digest}

# 正文章节结构：以纽约时报责任编辑的视角给正文排版。
# 不改写只分段 —— 长文直接通排没人读，章节独立存放后手机上才能读完。
structure_prompt: |
  你是《纽约时报》的责任编辑。下面这篇科技资讯正文要同时给中文读者和英文读者看，
  请把它重新排版，**一次给出双语的小标题**。

  要求：
  1. 不要改写、不要增删任何句子，段落原样照放；只做分段与加小标题。
  2. 按意思分成 1~3 节（给你的正文通常只是一篇长文里的一段，
     所以节数不要贪多）。每一节给出两个标题，含义必须对应：
     - h_zh：中文小标题，15 字以内，抓该节最关键的信息；
     - h_en：English heading, at most 8 words, the key point of this section.
       原文是中文时，h_en 写中文标题的英文翻译。
  3. 全文 3 段以内太短，不用分：输出一节，h_zh/h_en 留空字符串。
  4. paras 里放该节的段落，**一句都不许改**，段与段之间用 \n\n 分开。
  5. 只输出 JSON 数组，不要任何解释或 Markdown 代码块：
     [{"h_zh": "...", "h_en": "...", "paras": ["第一段原文", "第二段原文"]}]

  文章标题：{title}

  正文：
  {text}
