schedule:
  # 抓取与处理间隔（小时）
  fetch_interval_hours: 2
  # 「昨天」日报的定稿时间 HH:MM（默认昨天已不再变化，出的是定稿）
  daily_report_time: "08:00"
  # 清理时间 HH:MM
  cleanup_time: "03:00"

storage:
  retention_days: 30
  db_path: data/smtm.db
  # 去重时比对的历史标题条数
  dedup_recent_window: 500

web:
  host: 0.0.0.0
  port: 8000

llm:
  # 单次调用的超时。正文翻译是「每 4 个自然段一次调用」，中转网关的延迟
  # 波动很大（实测同一段短文本 4s ~ 22s），60 秒会把慢但成功的那次判成失败，
  # 于是整篇降级成英文 —— 表现和「模型不可用」一模一样，很难查。
  timeout_seconds: 120
  max_retries: 2
  temperature: 0.3

i18n:
  # 是否生成英文标题与英文导语（页面可在 中文 / English / 双语 间切换）。
  # 关掉可以省一次 LLM 调用。
  enabled: true
  # 把英文原文正文整篇译成中文，让中文模式下也能读完。成本较高，可关。
  translate_content: true
  # 每轮补译多少篇（限流失败的分批轮换回来，调大能更快把积压清掉）
  backfill_batch_size: 20

merge:
  # 是否合并「多家源报道同一件事」的文章（跨源转载标题差别很大，入库时去重抓不到）。
  # 关掉的话首页/日报里同一条新闻可能出现两三次。
  enabled: true
  # 每轮拿最近多少篇参与比较
  window: 40

ai:
  # 每个调度周期最多处理多少篇 pending（每篇要花 2~3 次 LLM 调用）
  batch_size: 60
  # 每处理多少篇提交一次，防止长任务中途失败回滚全部进度
  batch_checkpoint_every: 1
  # 「LLM 不可用而降级」的文章最多完整重试几次。
  # 上游限流时整篇会停在英文（标题/导读/正文都没有中文版），
  # 不重试就永远是英文；配额恢复后重新处理一次即可补齐。
  retry_max_attempts: 6

content:
  # 是否抓取正文全文（详情页页内读完靠它；每篇一次请求）
  enabled: true
  # 每轮最多抓多少篇
  batch_size: 20
  timeout_seconds: 12
  # 正文短于这个字数视为没抓到，保留短摘要
  min_chars: 200

media:
  # 是否在处理后补齐配图（RSS 没给图时抓文章页 og:image，每篇一次请求）
  enabled: true
  # 每轮最多补多少篇
  batch_size: 20
  timeout_seconds: 10

fetcher:
  timeout_seconds: 15
  max_retries: 2
  user_agent: "ShowMeTheMoney/0.1 (+https://github.com/zackzou/show-me-the-money)"
  # 只收最近 N 天发布的文章：挡掉「一次返回整个历史」的归档型 feed
  max_age_days: 14
  # 单个信源单次最多入库条数（成本闸门）
  max_items_per_source: 60
  # 正文短于该长度视为「只有标题」直接丢弃，0 = 不限制
  min_content_chars: 0
