<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Show Me the Money</title>
  <meta name="description" content="按调研方向自动筛选的行业热点资讯">
  <script>
    // 深浅色：跟随系统，可手动切换并记住
    (function () {
      var saved = localStorage.getItem("smtm-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) document.documentElement.classList.add("dark");
      var lang = localStorage.getItem("smtm-lang") || "zh";
      document.documentElement.setAttribute("data-lang", lang);
    })();
  </script>
  <style>
    :root {
      --bg:#f6f7f9; --surface:#ffffff; --line:#e5e7eb; --line-soft:#f0f1f3;
      --text:#111827; --muted:#6b7280; --faint:#9ca3af;
      --accent:#2563eb; --accent-soft:#eff6ff; --chip:#f3f4f6; --chip-text:#4b5563;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    }
    .dark {
      --bg:#0b0d10; --surface:#14171c; --line:#242a33; --line-soft:#1c2027;
      --text:#e8eaed; --muted:#9aa3af; --faint:#6b7280;
      --accent:#60a5fa; --accent-soft:#16233a; --chip:#1e232b; --chip-text:#c3c9d1;
      --shadow:none;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    /* 字体：拉丁字形用平台 UI 字体（与参考站一致），中文回退到苹方/雅黑 */
    body { margin:0; background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",
                       "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
           font-feature-settings:"kern","liga","tnum";
           -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    /* 英文内容用稍小的字号与灰一档的色，和中文形成主次 */
    .en { font-size:.92em; color:var(--muted); }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
    /* 详情页三栏，正文列需要更多宽度 */
    .wrap.wide { max-width:1400px; }
    .hd { position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
          backdrop-filter:saturate(1.6) blur(10px); border-bottom:1px solid var(--line); }
    .hd-in { display:flex; align-items:center; gap:20px; height:56px; }
    .brand { font-weight:700; font-size:16px; letter-spacing:-.2px; white-space:nowrap; flex:none; }
    .brand em { font-style:normal; color:var(--accent); }
    .nav { display:flex; gap:18px; font-size:13.5px; color:var(--muted); flex:none; white-space:nowrap; }
    .nav a:hover { color:var(--text); }
    .nav .on { color:var(--text); font-weight:600; }
    .sp { margin-left:auto; display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; justify-content:flex-end; }
    .ico { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line);
           border-radius:8px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:14px; }
    .ico:hover { color:var(--text); }
    .topics { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:16px 0 4px; font-size:12.5px; color:var(--faint); }
    .chip { background:var(--chip); color:var(--chip-text); border-radius:999px; padding:4px 11px; font-size:12.5px; }
    .lead { padding:14px 0 4px; }
    .kicker { font-size:11.5px; letter-spacing:.14em; color:var(--accent); font-weight:700; }
    h1 { font-size:30px; line-height:1.25; margin:8px 0 6px; letter-spacing:-.6px; }
    .meta { font-size:13px; color:var(--muted); }
    .meta b { color:var(--text); font-weight:600; }
    .list { padding:10px 0 40px; }
    /* ── 热点时间轴 ────────────────────────────────────────── */
    .tl { position:relative; padding:6px 0 40px; }
    /* 竖线对齐圆点圆心：时间列 92px + gap 12px，卡片左边缘在 104px，圆点圆心再往左 3.5px */
    .tl::before { content:""; position:absolute; left:100px; top:0; bottom:26px;
                  width:1px; background:var(--line); }
    .day-head { display:flex; align-items:center; gap:8px; margin:0 0 4px; font-size:15px; font-weight:650; }
    .day-head .caret { color:var(--faint); font-size:11px; }
    .day-head .meta { font-size:13px; font-weight:400; color:var(--faint); }

    .row { display:grid; grid-template-columns:92px 1fr; gap:0 12px; position:relative; }
    .row + .row { margin-top:4px; }
    /* 时间是 5 个字符（HH:MM），留足宽度并禁止换行，否则会被截成「10:3」 */
    .tl-time { text-align:right; padding:16px 0 0; font-size:12.5px; color:var(--faint);
               font-variant-numeric:tabular-nums; line-height:1.4;
               white-space:nowrap; overflow:visible; }
    .tl-main { position:relative; padding:0 0 14px; }
    /* 圆点横向落在竖线上（92+12-5-3.5 ≈ 95.5，加上 .tl 的 padding 偏移由 left 校正） */
    .tl-main::before { content:""; position:absolute; left:-7.5px; top:19px; width:7px; height:7px;
                       border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg); }
    /* 整卡可点：卡片本身不是链接，用标题链接的 ::after 铺满整张卡片。
       这样不会产生「a 里套 a」的非法结构，卡内的标签 / 收藏按钮仍可单独点。 */
    .item { position:relative; background:var(--surface); border:1px solid var(--line);
            border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; }
    .item:hover { border-color:var(--faint); }
    .item:hover .t { color:var(--accent); }
    .item .t::after { content:""; position:absolute; inset:0; border-radius:inherit; }
    /* 卡内独立可点的元素必须浮到拉伸链接之上 */
    .item .cats a, .item .bm, .item .more, .item .rail-chip { position:relative; z-index:2; }
    /* 拖选时给出反馈：真正在选文字时不要变成手型 */
    .item ::selection, .item::selection { background:var(--accent-soft); }
    .i-head { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
    .i-head .src { font-weight:600; color:var(--text); }
    .badge { background:#fef3c7; color:#92400e; border-radius:4px; padding:1px 7px; font-size:11px; }
    .score { margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
             color:var(--muted); background:var(--chip); border-radius:999px; padding:2px 9px;
             font-variant-numeric:tabular-nums; }
    .score b { color:var(--text); font-weight:650; }
    .score.strong { background:var(--accent-soft); color:var(--accent); }
    .score.strong b { color:var(--accent); }
    .t { margin-top:7px; font-size:17px; font-weight:650; line-height:1.5; letter-spacing:-.2px; }
    .d { margin-top:8px; font-size:14px; line-height:1.8; color:var(--muted); }
    .why { margin-top:12px; padding-top:11px; border-top:1px dashed var(--line);
           font-size:12.5px; line-height:1.7; color:var(--faint); }
    .why b { color:var(--muted); font-weight:600; }
    .i-foot { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:7px; font-size:11.5px;
              color:var(--faint); }
    .tag { background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:2px 8px; }
    .warn { background:#fef3c7; color:#92400e; border-radius:5px; padding:2px 8px; }
    .more { margin-left:auto; color:var(--accent); font-size:12.5px; white-space:nowrap; }
    @media (max-width:640px) {
      .tl::before { left:9px; } .row { grid-template-columns:1fr; }
      .tl-time { text-align:left; padding:12px 0 0 22px; }
      .tl-main::before { left:6px; top:16px; }
      .side { position:static; }
    }

    /* ── 历史日报（可展开） ────────────────────────────────── */
    .arc { margin:18px 0 46px; border-top:1px solid var(--line); }
    .arc-row { border-bottom:1px solid var(--line); }
    .arc-head { width:100%; display:flex; align-items:center; gap:14px; cursor:pointer;
                padding:17px 4px; background:none; border:0; color:inherit; font-family:inherit;
                font-size:14px; text-align:left; transition:background-color .16s ease, padding .16s ease; }
    .arc-head:hover { background:var(--surface); padding-left:10px; padding-right:10px; }
    .arc-head .caret { color:var(--faint); font-size:10px; transition:transform .2s ease; flex:none; }
    .arc-row.open .caret { transform:rotate(90deg); }
    .arc-date { font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
    .arc-week { color:var(--faint); font-size:12.5px; flex:none; }
    .arc-bar { flex:1; height:4px; border-radius:999px; background:var(--line-soft); overflow:hidden; min-width:60px; }
    .arc-bar i { display:block; height:100%; border-radius:999px; background:var(--accent); opacity:.55; }
    .arc-row.open .arc-bar i { opacity:1; }
    .arc-count { color:var(--muted); font-size:12.5px; flex:none; font-variant-numeric:tabular-nums; }
    .arc-rel { color:var(--faint); font-size:12px; flex:none; min-width:64px; text-align:right; }
    .arc-panel { padding:2px 4px 20px 32px; }
    .arc-inner { border-left:2px solid var(--line); padding-left:16px; }
    .arc-item { display:flex; gap:12px; padding:7px 8px; border-radius:8px; font-size:13.5px; line-height:1.6; }
    .arc-item:hover { background:var(--surface); }
    .arc-item .arc-time { color:var(--faint); font-size:11.5px; flex:none; padding-top:3px;
                          font-variant-numeric:tabular-nums; }
    .arc-item .arc-tt { color:var(--text); }
    .arc-item:hover .arc-tt { color:var(--accent); }
    .arc-item .en { font-size:.92em; }
    .arc-tip { color:var(--faint); font-size:12.5px; margin:6px 0; }
    .arc-all { display:inline-block; margin-top:12px; font-size:12.5px; color:var(--accent); }
    @media (max-width:720px) {
      .arc-head { flex-wrap:wrap; gap:8px 12px; }
      .arc-bar { order:9; flex-basis:100%; }
      .arc-panel { padding-left:12px; }
    }

    /* 窄屏收缩顺序：搜索框 → RSS → 导航 */
    @media (max-width:1080px) { .hd-in { gap:14px; } .nav { gap:13px; } }
    @media (max-width:960px) { .nav a[href="/rss"] { display:none; } }
    @media (max-width:820px) { .brand { font-size:0; }
      .brand em { font-size:16px; } .search { min-width:120px; } }
    @media (max-width:680px) { .nav { display:none; } .hd-in { gap:10px; } }

    .pager { display:flex; justify-content:center; align-items:center; gap:8px; padding:20px 0 10px; font-size:13px; }
    .pager a, .pager span { border:1px solid var(--line); background:var(--surface); border-radius:8px;
                            padding:6px 13px; color:var(--muted); }
    .pager .cur { border-color:var(--accent); color:var(--accent); font-weight:600; }
    .empty { text-align:center; color:var(--faint); padding:70px 0; border:1px dashed var(--line); border-radius:14px; }
    .ft { border-top:1px solid var(--line); color:var(--faint); font-size:12px; padding:22px 0 34px; }

    /* ── 搜索框 ────────────────────────────────────────────── */
    .search { display:flex; align-items:center; gap:7px; width:250px; padding:6px 10px;
              background:var(--surface); border:1px solid var(--line); border-radius:999px; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .s-ico { color:var(--faint); font-size:14px; }
    .search input { flex:1; min-width:0; border:0; outline:0; background:transparent;
                     color:var(--text); font-size:13px; }
    .search input::-webkit-search-cancel-button { display:none; }
    .s-key { font-size:10px; color:var(--faint); border:1px solid var(--line);
             border-radius:4px; padding:0 4px; font-family:ui-monospace,monospace; }
    .s-clear { color:var(--faint); font-size:16px; line-height:1; padding:0 2px; }
    .s-clear:hover { color:var(--text); }
    @media (max-width:760px) { .search { width:150px; } }

    /* ── 中英双语 ──────────────────────────────────────────── */
    .zh, .en { display:block; }
    html[data-lang="zh"] .en { display:none; }
    html[data-lang="en"] .zh { display:none; }
    html[data-lang="en"] .en { font-size:1em; color:var(--text); }
    html[data-lang="both"] .en { margin-top:5px; padding-left:9px; border-left:2px solid var(--line); }
    html[data-lang="both"] .t .en { margin-top:7px; }
    html[data-lang="both"] .d .en { margin-top:6px; }
    /* 语言切换 */
    .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
            background:var(--surface); }
    .lang { flex:none; }
    .lang button { border:0; background:transparent; cursor:pointer; padding:5px 11px;
                   font-size:12px; color:var(--muted); font-family:inherit; line-height:1.5;
                   white-space:nowrap; }
    .lang button:hover { color:var(--text); }
    .lang button.on { background:var(--accent); color:#fff; font-weight:600; }

    /* ── 分类 tab（带切换特效） ─────────────────────────────── */
    .tabs { display:flex; flex-wrap:wrap; gap:2px; align-items:flex-end; }
    /* 切换特效：药丸高亮 + 上浮 + 下方连接线（参考站的做法） */
    .tab { position:relative; padding:8px 16px 10px; border-radius:999px 999px 0 0;
           font-size:13px; color:var(--muted); white-space:nowrap;
           border:1px solid transparent; border-bottom:0;
           transition:color .18s ease, background-color .18s ease, transform .18s cubic-bezier(.2,.9,.3,1.2),
                       box-shadow .18s ease; }
    .tab:hover { color:var(--text); background:var(--chip); transform:translateY(-2px); }
    .tab.on { color:var(--text); font-weight:600; background:var(--surface);
              border-color:var(--line); transform:translateY(-3px);
              box-shadow:0 6px 16px -8px rgba(16,24,40,.22); }
    /* 选中项下方一小段竖线，指向内容区 */
    .tab.on::after { content:""; position:absolute; left:50%; bottom:-1px; width:1px; height:14px;
                     background:var(--line); transform:translateX(-50%); }
    .tab .n { color:var(--faint); font-size:11.5px; margin-left:3px; }
    .tab.on .n { color:var(--accent); }
    @media (prefers-reduced-motion:reduce) {
      .tab, .tab:hover, .tab.on { transition:none; transform:none; }
    }
    .sub-bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px;
               justify-content:space-between; padding:12px 0 4px; }
    .sub-left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .scope { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
    .scope a { padding:5px 13px; font-size:12.5px; color:var(--muted); background:var(--surface); }
    .scope a.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
    .hit { font-size:12.5px; color:var(--faint); }
    .hit b { color:var(--text); }

    /* 分类 + 标签行（可点） */
    .cats { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
    .cat { font-size:11.5px; color:var(--muted); background:var(--chip); border-radius:5px; padding:2px 8px; }
    .cat:hover { background:var(--accent-soft); color:var(--accent); }
    .tagx { font-size:11.5px; color:var(--faint); }
    .tagx:hover { color:var(--accent); }
    .bm { background:none; border:0; color:var(--faint); cursor:pointer; padding:2px 3px;
          font-size:14px; line-height:1; }
    .bm:hover, .bm.on { color:var(--accent); }

    /* ── 单篇详情：左栏来源信息 + 右栏正文 ─────────────────── */
    .story { display:grid; grid-template-columns:216px minmax(0,1fr) 300px; gap:52px; padding:34px 0 64px; }
    @media (max-width:1180px) { .story { grid-template-columns:190px minmax(0,1fr); gap:36px; } .rail { grid-column:1 / -1; } }
    @media (max-width:860px) {
      .story { grid-template-columns:1fr; gap:24px; }
      .side { order:3; } .rail { order:2; }
      .side, .rail { position:static; }
    }
    .side, .rail { font-size:12.5px; color:var(--muted); position:sticky; top:76px; align-self:start; }
    .rail { border:1px solid var(--line); border-radius:12px; padding:18px 18px; background:var(--surface); }
    .rail-sec + .rail-sec { margin-top:22px; padding-top:20px; border-top:1px solid var(--line-soft); }
    .rail-h { font-size:11.5px; color:var(--faint); margin-bottom:10px; }
    .rail .why { margin:0; padding:0; border:0; font-size:13px; line-height:1.85; color:var(--muted); }
    .rail-open { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .btn-open { flex:1; text-align:center; padding:7px 12px; border-radius:8px; font-size:13px;
                background:var(--surface); border:1px solid var(--line); color:var(--text); }
    .btn-open:hover { border-color:var(--accent); color:var(--accent); }
    .rail-chip { display:inline-block; font-size:11.5px; color:var(--muted); background:var(--chip);
                 border-radius:999px; padding:4px 11px; margin:0 6px 6px 0; }
    .rail-chip:hover { background:var(--accent-soft); color:var(--accent); }
    .rail-tag { display:inline-block; font-size:11.5px; color:var(--faint); background:var(--chip);
                border-radius:5px; padding:3px 9px; margin:0 6px 6px 0; }
    .side .back { color:var(--muted); display:inline-block; margin-bottom:18px; }
    .side .back:hover { color:var(--accent); }
    .side dt { color:var(--faint); font-size:11.5px; margin-top:22px; }
    .side dd { margin:5px 0 0; color:var(--text); font-size:13.5px; line-height:1.65; word-break:break-all; }
    .side .back { margin-bottom:22px; }
    .body-title { font-size:34px; font-weight:700; line-height:1.32; letter-spacing:-.9px; }
    .sub { margin-top:14px; font-size:15px; color:var(--muted); font-style:italic; line-height:1.65; }
    .sec { margin-top:40px; }
    .sec-t { font-size:12px; letter-spacing:.1em; color:var(--accent); font-weight:700; margin-bottom:16px; }
    .sec-t.plain { color:var(--faint); }
    .lead-p { font-size:17.5px; line-height:2.05; color:var(--text); }
    .rule { height:1px; background:var(--line); margin:34px 0; }
    .prose p { margin:0 0 24px; font-size:17px; line-height:2.05; color:var(--text); }
    .prose h3 { margin:38px 0 16px; font-size:19px; font-weight:650; line-height:1.5; color:var(--text); }
    .tail { margin-top:44px; padding-top:22px; border-top:1px solid var(--line); font-size:13px; color:var(--faint); }
    /* 本文目录（左栏） */
    .toc { margin-top:10px; border-left:2px solid var(--line); padding-left:12px; }
    .toc a { display:block; padding:5px 0; font-size:12.5px; line-height:1.6; color:var(--muted); }
    .toc a:hover { color:var(--accent); }
    .shot-grid { margin-top:22px; display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
    .shot-grid img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:9px;
                     border:1px solid var(--line); cursor:zoom-in; background:var(--chip); }

    /* 页内放大，不跳原站 */
    .lb { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; z-index:100;
          align-items:center; justify-content:center; padding:26px; }
    .lb.on { display:flex; }
    .lb img { max-width:100%; max-height:100%; border-radius:8px; }
    .lb-x { position:absolute; top:14px; right:18px; color:#fff; font-size:26px; cursor:pointer; line-height:1; }
    .lb-n { position:absolute; bottom:16px; color:#ddd; font-size:13px; }
  </style>
</head>
<body class="h-full">
<header class="hd">
  <div class="wrap hd-in">
    <a href="/" class="brand">Show Me the <em>Money</em></a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if title in ('热点资讯', '搜索') else '' }}">热点资讯</a>
      <a href="/archive" class="{{ 'on' if title == '历史日报' else '' }}">历史日报</a>
      <a href="/saved" class="{{ 'on' if title == '我的收藏' else '' }}">收藏</a>
      <a href="/rss">RSS</a>
    </nav>
    <form class="sp" action="/search" method="get" role="search">
      <div class="search">
        <span class="s-ico" aria-hidden="true">⌕</span>
        <input type="search" name="q" id="q" value="{{ q|default('') }}" placeholder="搜索标题、摘要…" autocomplete="off">
        {% if q|default('') %}
          <a class="s-clear" href="/search" title="清空">×</a>
        {% else %}
          <kbd class="s-key">/</kbd>
        {% endif %}
      </div>
    </form>
    <div class="lang" id="lang" role="group" aria-label="语言">
      <button type="button" data-lang="zh" title="只显示中文">中文</button>
      <button type="button" data-lang="en" title="English only">EN</button>
      <button type="button" data-lang="both" title="中文在上，英文在下">双语</button>
    </div>
    <button class="ico" id="theme" title="切换深浅色">◐</button>
    <a class="ico" href="/api/health" title="状态">⋯</a>
  </div>
</header>

<main class="wrap{% block container_extra %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<footer class="wrap ft">
  由 Show Me the Money 自动生成 · 每天 08:00 定稿前一日日报 · 当天每 2 小时滚动刷新
</footer>

<div class="lb" id="lb">
  <span class="lb-x" id="lb-x">×</span>
  <img id="lb-img" alt="">
  <span class="lb-n" id="lb-n"></span>
</div>
<script>
  // 深浅色切换
  var themeBtn = document.getElementById("theme");
  if (themeBtn) themeBtn.onclick = function () {
    var dark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("smtm-theme", dark ? "dark" : "light");
  };
  // 语言切换：默认中文，可切英文 / 双语
  (function () {
    var box = document.getElementById("lang");
    function apply(value) {
      document.documentElement.setAttribute("data-lang", value);
      try { localStorage.setItem("smtm-lang", value); } catch (err) { /* 隐私模式 */ }
      if (!box) return;
      box.querySelectorAll("button[data-lang]").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-lang") === value);
      });
    }
    if (box) box.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-lang]");
      if (b) { e.preventDefault(); apply(b.getAttribute("data-lang")); }
    });
    // 控件在就用它回显当前语言，不在也照样切换语言显示
    apply(document.documentElement.getAttribute("data-lang") || "zh");
  })();
  // 图片页内放大（替代「跳原站看图」）
  var lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbN = document.getElementById("lb-n");
  function show(src, n, total) { lbImg.src = src; lbN.textContent = total > 1 ? (n + 1) + " / " + total : ""; lb.classList.add("on"); }
  function hide() { lb.classList.remove("on"); lbImg.src = ""; }
  document.addEventListener("click", function (e) {
    var img = e.target.closest("[data-shot]");
    if (img) { show(img.getAttribute("data-shot"), +img.getAttribute("data-i") || 0, +img.getAttribute("data-n") || 1); return; }
    if (e.target.id === "lb" || e.target.id === "lb-x") hide();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
  // 「/」聚焦搜索框（搜索框里打字时不拦截）
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
    var box = document.getElementById("q");
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  });
  // 收藏：存在浏览器 localStorage，不上传任何数据
  var KEY = "smtm-saved";
  function saved() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (err) { return []; } }
  function toggleSave(id) {
    var list = saved(), i = list.indexOf(id), on = i < 0;
    if (on) { list.push(id); } else { list.splice(i, 1); }
    localStorage.setItem(KEY, JSON.stringify(list));
    document.querySelectorAll('[data-save="' + id + '"]').forEach(function (b) {
      b.classList.toggle("on", on); b.textContent = on ? "★" : "☆";
    });
  }
  window.smtmSaved = saved;
  window.smtmToggleSave = toggleSave;
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-save]");
    if (b) { e.preventDefault(); toggleSave(Number(b.getAttribute("data-save"))); }
  });
  document.querySelectorAll("[data-save]").forEach(function (b) {
    var on = saved().indexOf(Number(b.getAttribute("data-save"))) >= 0;
    b.classList.toggle("on", on); b.textContent = on ? "★" : "☆";
  });
</script>

{% block extra %}{% endblock %}
</body></html>
