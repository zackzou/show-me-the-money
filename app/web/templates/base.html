<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Show Me the Money</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <nav class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-bold text-lg">Show Me the Money</a>
      <a href="/archive" class="text-sm text-slate-600 hover:text-slate-900">历史日报</a>
      <a href="/rss" class="text-sm text-slate-600 hover:text-slate-900">RSS</a>
      <a href="/api/health" class="text-sm text-slate-600 hover:text-slate-900 ml-auto">状态</a>
    </nav>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-3xl mx-auto px-4 pb-10 text-xs text-slate-400">
    由 Show Me the Money 自动生成 · 每天 {{ "08:00" }} 更新
  </footer>
</body>
</html>
