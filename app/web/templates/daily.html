{% extends "base.html" %}
{% block content %}
  {% if report %}
    <h1 class="text-2xl font-bold tracking-tight">日报 · {{ report.date }}</h1>
    <p class="mt-2 text-sm text-slate-500">共 {{ report.article_count }} 篇与调研方向直接相关的报道</p>
    {% include "_articles.html" %}
  {% else %}
    <h1 class="text-2xl font-bold">{{ date }} 没有日报</h1>
    <p class="mt-2 text-sm text-slate-500">这一天还没有生成日报，去 <a class="text-blue-600" href="/archive">历史日报</a> 看看其它日期。</p>
  {% endif %}
{% endblock %}
