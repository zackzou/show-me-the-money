{% extends "base.html" %}
{% from "_articles.html" import timeline %}
{% block content %}

<div class="lead">
  <div class="kicker">DAILY DIGEST</div>
  <h1>日报 · {{ date }}</h1>
  <p class="meta">
    {% if report %}共 <b>{{ article_count }}</b> 篇与调研方向直接相关的报道
    {% else %}这一天没有生成日报{% endif %}
  </p>
</div>

{{ timeline(groups, '这一天还没有筛选出相关报道。去历史日报看看其它日期。') }}

{% endblock %}
