{# 图标：AIHOT 皮肤侧栏 / 底部标签栏 / 外观切换共用。
   线条风格（stroke=currentColor），与 AIHOT 的 icons.tsx 同一种画法。
   默认皮肤不引用这里，不产生任何输出。 #}
{% macro ic(name, size=17) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}
  <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/>
{%- elif name == 'archive' -%}
  <path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>
{%- elif name == 'saved' -%}
  <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.2L5 21V4a1 1 0 0 1 1-1Z"/>
{%- elif name == 'sources' -%}
  <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/>
{%- elif name == 'settings' -%}
  <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2.2"/><circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="18" r="2.2"/>
{%- elif name == 'rss' -%}
  <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'moon' -%}
  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
{%- elif name == 'monitor' -%}
  <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
{%- elif name == 'skin' -%}
  <path d="M12 3a9 9 0 1 0 9 9c0-1.3-1-2-2.2-1.7l-2.4.6a2.2 2.2 0 0 1-2.7-2.7l.6-2.4C14.6 4.5 13.6 3 12 3Z"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1.2" fill="currentColor" stroke="none"/>
{%- elif name == 'chart' -%}
  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'filter' -%}
  <path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/>
{%- elif name == 'trash' -%}
  <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/>
{%- elif name == 'status' -%}
  <path d="M3 12h4l2-6 3 12 3-9 2 3h4"/>
{%- endif -%}
</svg>
{%- endmacro %}
