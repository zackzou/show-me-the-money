{% extends "base.html" %}
{% from "_articles.html" import timeline %}
{% block content %}

<div class="lead">
  <div class="kicker">SAVED</div>
  <h1>我的收藏</h1>
  <p class="meta">收藏保存在<b>你这台设备的浏览器</b>里，不会上传到任何服务器。</p>
</div>

<div id="saved-root"><div class="empty">正在读取本地收藏…</div></div>

{% endblock %}
{% block extra %}
<script>
  // 收藏列表在浏览器本地，页面渲染时按 id 拉接口
  var ids = window.smtmSaved ? window.smtmSaved() : [];
  function esc(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // 与 _articles.html 的 bi() 宏同一套规则：中文优先，缺哪边用另一边顶上，
  // 两版相同只出一个 span（否则切到英文模式时 .zh 被藏掉会变成空白）。
  function bilingual(zh, en) {
    zh = (zh || "").trim();
    en = (en || "").trim();
    if (!zh && !en) return "";
    if (zh === en) return '<span class="same">' + esc(zh) + "</span>";
    return '<span class="zh">' + esc(zh || en) + '</span><span class="en">' + esc(en || zh) + "</span>";
  }
  // 收藏里可能有几天前的文章，而 /api/articles 默认只返回今天，
  // 所以逐个按 id 取详情，别用列表接口凑。
  Promise.all(
    ids.map(function (id) {
      return fetch("/api/articles/" + id)
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    })
  )
    .then(function (picked) {
      picked = picked.filter(Boolean);
      picked.sort(function (a, b) { return (b.published_at || "").localeCompare(a.published_at || ""); });
      var root = document.getElementById("saved-root");
      if (!picked.length) {
        root.innerHTML = '<div class="empty">还没有收藏。<br><span style="font-size:12.5px">在列表或详情页点 ☆ 就能收藏。</span></div>';
        return;
      }
      var html = '<div class="list">';
      picked.forEach(function (a) {
        var t = (a.published_at || "").slice(5, 16).replace("T", " ");
        html += '<article class="item"><div class="i-head"><span>' + esc(t) + "</span>"
          + '<button class="bm on" data-save="' + a.id + '">★</button></div>'
          + '<a href="/story/' + a.id + '"><div class="t">'
          + bilingual(a.title_zh || a.title, a.title_en) + "</div></a>"
          + '<p class="d">' + bilingual(a.digest_zh || a.digest || a.summary, a.digest_en) + "</p></article>";
      });
      root.innerHTML = html + "</div>";
      // 注意：不要再绑 onclick。base.html 已经用事件委托统一处理 [data-save]，
      // 这里再绑一次会 toggle 两遍 —— 点了等于没点（还会把 localStorage 顺序弄乱）。
      // 只需要把被取消的那条从列表里去掉。
      root.addEventListener("click", function (e) {
        if (!e.target.closest("[data-save]")) return;
        setTimeout(function () {
          var left = (window.smtmSaved ? window.smtmSaved() : []).slice();
          if (!left.length) { location.reload(); return; }
          fetch("/api/articles/" + left[0])
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function () { location.reload(); })
            .catch(function () { location.reload(); });
        }, 0);
      });
    })
    .catch(function () {
      document.getElementById("saved-root").innerHTML = '<div class="empty">读取失败。</div>';
    });
</script>
{% endblock %}
